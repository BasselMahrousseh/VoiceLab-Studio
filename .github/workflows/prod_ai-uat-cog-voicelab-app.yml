# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# Pre-built venv (no Oryx): https://azureossd.github.io/2024/07/25/Deploying-your-own-virtual-environment-with-Python-and-App-Service-Linux/

name: Build and deploy Python app to Azure Web App - AI-UAT-COG-VoiceLab-APP

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          # Must match App Service Python major.minor so antenv site-packages path resolves
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Build the Linux venv in CI. Name must be "antenv" so App Service activates it
      # and sets PYTHONPATH when SCM_DO_BUILD_DURING_DEPLOYMENT=false.
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare deployment package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/frontend

          cp -R backend package/backend
          rm -rf package/backend/tests package/backend/data
          find package/backend -type d -name '__pycache__' -prune -exec rm -rf {} +
          find package/backend -type f -name '*.py[co]' -delete

          cp -R frontend/dist package/frontend/dist
          cp -R antenv package/antenv
          cp requirements.txt startup.sh package/

          cd package
          zip -r ../release.zip . \
            -x '*/__pycache__/*' \
            -x '*.pyc' \
            -x '*.pyo' \
            -x '*/.git/*'

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'antenv/bin/python'
            'antenv/lib/python3.13/site-packages/fastapi'
            'antenv/lib/python3.13/site-packages/uvicorn'
            'backend/app/main.py'
            'frontend/dist/index.html'
            'startup.sh'
            'requirements.txt'
          )
          listing="$(unzip -l release.zip)"
          echo "$listing" | tail -n 5
          for path in "${required[@]}"; do
            if ! echo "$listing" | grep -F "$path" >/dev/null; then
              echo "::error::Missing required path in release.zip: $path"
              exit 1
            fi
            echo "OK: $path"
          done

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'AI-UAT-COG-VoiceLab-APP'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E9E304DF9803495E8F0D5B66C66195F0 }}
          # Pre-built zip only — App Service must not run pip/Oryx on this package
          package: release.zip
